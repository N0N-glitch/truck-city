<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10161c" />
  <title>TRUCK CITY - Fase 2</title>
  <!-- ?v=2 evita que o GitHub Pages/navegador sirva arquivos antigos do cache -->
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <!-- Canvas do Phaser entra aqui -->
  <div id="game-container"></div>

  <!-- TELA DE CONFIGURAÇÃO INICIAL -->
  <div id="setup">
    <div id="step-device" class="panel">
      <h1>TRUCK CITY</h1>
      <p class="question">Você está jogando no PC ou Celular?</p>
      <button class="big" data-device="pc">PC</button>
      <button class="big" data-device="mobile">Celular</button>
    </div>

    <div id="step-mobile" class="panel hidden">
      <h1>TRUCK CITY</h1>
      <p class="question">Como prefere dirigir o caminhão?</p>
      <button class="big" data-mode="buttons">Botões direcionais na tela</button>
      <button class="big" data-mode="wheel">Volante virtual + Pedais</button>
      <button class="ghost" id="btn-back">&larr; Voltar</button>
    </div>
  </div>

  <!-- HUD compacto -->
  <div id="hud" class="hidden">
    <div id="hud-box">
      <div id="hud-line">A pé</div>
      <div id="hud-status"></div>
      <div id="hud-help"></div>
    </div>
    <div id="hud-msg"></div>
  </div>

  <!-- BOTÃO CONTEXTUAL (oculto por padrão; só aparece perto de algo interativo) -->
  <button id="btn-action" type="button">
    <span id="action-label"></span><span class="key">E</span>
  </button>

  <!-- CONTROLES MOBILE -->
  <div id="controls" class="hidden">

    <!-- Opção A: botões direcionais -->
    <div id="dpad">
      <button class="ctl" data-hold="up">&#9650;</button>
      <button class="ctl" data-hold="left">&#9664;</button>
      <button class="ctl" data-hold="right">&#9654;</button>
      <button class="ctl" data-hold="down">&#9660;</button>
    </div>

    <!-- Opção B: volante (esquerda) + pedais (direita) -->
    <div id="wheel-wrap">
      <div id="wheel">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="rgba(0,0,0,.30)" stroke="#e6e6e6" stroke-width="8"/>
          <circle cx="50" cy="50" r="10" fill="#e6e6e6"/>
          <line x1="8"  y1="50" x2="40" y2="50" stroke="#e6e6e6" stroke-width="7"/>
          <line x1="60" y1="50" x2="92" y2="50" stroke="#e6e6e6" stroke-width="7"/>
          <line x1="50" y1="60" x2="50" y2="92" stroke="#e6e6e6" stroke-width="7"/>
          <rect x="46" y="3" width="8" height="12" fill="#ffd400"/>
        </svg>
      </div>
    </div>

    <div id="pedals">
      <button class="ctl pedal" id="pedal-brake" data-hold="brake">FREIO<br />/ R&Eacute;</button>
      <button class="ctl pedal" id="pedal-gas" data-hold="gas">ACEL.</button>
    </div>
  </div>

  <!-- COMPUTADOR DO ESCRITÓRIO (sistema de gerenciamento) -->
  <div id="pc-ui" class="hidden" role="dialog" aria-label="Computador do escritório">
    <div id="pc-window">
      <div id="pc-titlebar">
        <button id="pc-back" class="pc-btn hidden">&larr; Início</button>
        <span id="pc-title">TruckOS</span>
        <button id="pc-close" class="pc-btn">&#10005; Fechar</button>
      </div>

      <div id="pc-body">
        <!-- Área de trabalho -->
        <div id="pc-home">
          <button class="app-icon" data-app="contracts">
            <span class="ico">&#128196;</span>
            <span class="name">Contratos</span>
            <span class="badge" id="badge-contracts">0</span>
          </button>
          <button class="app-icon" data-app="stock">
            <span class="ico">&#128230;</span>
            <span class="name">Estoque</span>
            <span class="badge warn hidden" id="badge-stock">0</span>
          </button>
        </div>

        <!-- App: Contratos -->
        <section id="app-contracts" class="app hidden">
          <div class="tabs">
            <button class="tab active" data-tab="available">Disponíveis</button>
            <button class="tab" data-tab="active">Em andamento <span id="count-active">0</span></button>
          </div>
          <div id="contracts-list" class="grid"></div>
        </section>

        <!-- App: Estoque -->
        <section id="app-stock" class="app hidden">
          <div id="stock-summary" class="summary"></div>
          <div id="stock-list" class="grid"></div>
        </section>
      </div>

      <div id="pc-tray"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/controls.js?v=2"></script>
  <script src="js/pc.js?v=2"></script>
  <script src="js/game.js?v=2"></script>
</body>
</html>
