<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10161c" />
  <title>TRUCK CITY - Atualização 4.0</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>

  <!-- Canvas do Phaser -->
  <div id="game-container"></div>

  <!-- TELA DE CONFIGURAÇÃO INICIAL -->
  <div id="setup">
    <div id="step-device" class="panel">
      <h1>TRUCK CITY</h1>
      <p class="question">Você está jogando no PC ou Celular?</p>
      <button class="big" data-device="pc">PC</button>
      <button class="big" data-device="mobile">Celular</button>
    </div>

    <div id="step-mobile" class="panel hidden">
      <h1>TRUCK CITY</h1>
      <p class="question">Como prefere dirigir o caminhão?</p>
      <button class="big" data-mode="buttons">Botões direcionais na tela</button>
      <button class="big" data-mode="wheel">Volante virtual + Pedais</button>
      <button class="ghost" id="btn-back">&larr; Voltar</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hud-box">
      <div id="hud-money"><span class="coin">$</span><b id="money-val">0</b></div>
      <div id="hud-line">A pé</div>
      <div id="hud-status"></div>
      <div id="hud-help"></div>
    </div>

    <!-- Painel da missão (canto superior direito) -->
    <div id="mission-box" class="hidden">
      <div class="m-head"><span class="m-tag">MISSÃO</span><span id="m-time" class="m-time"></span></div>
      <div id="m-title"></div>
      <div id="m-step"></div>
      <div id="m-prog" class="hidden">
        <div class="bar"><i id="m-prog-bar"></i></div>
        <span id="m-prog-label"></span>
      </div>
      <div id="m-nav" class="hidden">
        <svg id="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h14M13 6l6 6-6 6"/>
        </svg>
        <span id="nav-dist"></span>
      </div>
    </div>

    <div id="hud-msg"></div>

    <div id="banner">
      <div id="banner-title"></div>
      <div id="banner-sub"></div>
    </div>

    <!-- Resumo de entrega -->
    <div id="summary" class="hidden"></div>
  </div>

  <!-- BOTÃO CONTEXTUAL (A pé ou Entrar/Sair) -->
  <button id="btn-action" type="button">
    <span id="action-label"></span><span class="key">E</span>
  </button>

  <!-- BOTÃO DE CELULAR MÓVEL (NOVO! Visível apenas a pé fora do caminhão, canto inferior direito acima do contextual) -->
  <button id="btn-mobile-phone" class="hidden" type="button" title="Abrir Celular Móvel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
    </svg>
    <span>Celular</span>
  </button>

  <!-- CONTROLES MOBILE -->
  <div id="controls" class="hidden">
    <div id="dpad">
      <button class="ctl" data-hold="up">&#9650;</button>
      <button class="ctl" data-hold="left">&#9664;</button>
      <button class="ctl" data-hold="right">&#9654;</button>
      <button class="ctl" data-hold="down">&#9660;</button>
    </div>

    <div id="wheel-wrap">
      <div id="wheel">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="rgba(0,0,0,.30)" stroke="#e6e6e6" stroke-width="8"/>
          <circle cx="50" cy="50" r="10" fill="#e6e6e6"/>
          <line x1="8"  y1="50" x2="40" y2="50" stroke="#e6e6e6" stroke-width="7"/>
          <line x1="60" y1="50" x2="92" y2="50" stroke="#e6e6e6" stroke-width="7"/>
          <line x1="50" y1="60" x2="50" y2="92" stroke="#e6e6e6" stroke-width="7"/>
          <rect x="46" y="3" width="8" height="12" fill="#ffd400"/>
        </svg>
      </div>
    </div>

    <div id="pedals">
      <button class="ctl pedal" id="pedal-brake" data-hold="brake">FREIO<br />/ RÉ</button>
      <button class="ctl pedal" id="pedal-gas" data-hold="gas">ACEL.</button>
    </div>
  </div>

  <!-- COMPUTADOR DA TRANSPORTADORA (TruckOS) / LOJA / CELULAR -->
  <div id="pc-ui" class="hidden" role="dialog" aria-label="Computador da transportadora">
    <div id="os">
      <div id="os-top">
        <div class="os-brand">
          <span class="os-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5h11V16H2z"/><path d="M13 9.5h4l3 3.2V16h-7z"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="16.5" cy="17.5" r="2"/></svg>
          </span>
          <b>TruckOS</b>
          <span id="os-company"></span>
        </div>
        <div class="os-tray">
          <span id="os-money" class="chip"></span>
          <span id="os-clock" class="chip"></span>
        </div>
      </div>

      <div id="os-desktop">
        <div id="os-icons"></div>
        <aside id="os-widgets"></aside>
      </div>

      <section id="os-window" class="hidden">
        <header id="win-bar">
          <span id="win-ico"></span>
          <span id="win-title"></span>
          <button id="win-close" class="win-btn" data-act="desktop" aria-label="Fechar janela">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <div id="win-body"></div>
      </section>

      <div id="os-toast"></div>

      <footer id="os-dock">
        <button class="dock-btn" data-act="desktop" title="Área de trabalho">
          <span class="tile tone-slate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          </span>
          <span class="dlbl">Desktop</span>
        </button>
        <div id="dock-apps"></div>
        <button class="dock-btn power" data-act="power" title="Desligar e voltar ao jogo">
          <span class="tile tone-red">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>
          </span>
          <span class="dlbl">Sair</span>
        </button>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/controls.js?v=4"></script>
  <script src="js/store.js?v=4"></script>
  <script src="js/art.js?v=4"></script>
  <script src="js/pc.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
</body>
</html>
